<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      /* CSS Keyframe Animations */
      @keyframes pulse-wave {
        0% { transform: scale(0.95); opacity: 0.25; }
        50% { transform: scale(1.05); opacity: 0.65; }
        100% { transform: scale(0.95); opacity: 0.25; }
      }

      @keyframes float-pill {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }

      @keyframes float-pill-rev {
        0% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
        100% { transform: translateY(0px); }
      }

      @keyframes scan-line {
        0% { transform: translateX(-400px); opacity: 0; }
        30% { opacity: 0.8; }
        70% { opacity: 0.8; }
        100% { transform: translateX(1300px); opacity: 0; }
      }

      @keyframes radar-sweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes shimmer {
        0% { stop-color: #38bdf8; }
        50% { stop-color: #f472b6; }
        100% { stop-color: #38bdf8; }
      }

      .animated-wave {
        transform-origin: 600px 180px;
        animation: pulse-wave 6s ease-in-out infinite;
      }

      .floating-tag-1 {
        animation: float-pill 5s ease-in-out infinite;
      }

      .floating-tag-2 {
        animation: float-pill-rev 6s ease-in-out infinite 0.5s;
      }

      .floating-tag-3 {
        animation: float-pill 7s ease-in-out infinite 1s;
      }

      .scanner-beam {
        animation: scan-line 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .radar-sweep-elem {
        transform-origin: 1050px 180px;
        animation: radar-sweep 12s linear infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="18" fill="url(#bg-grad)"/>
  <rect width="1196" height="356" x="2" y="2" rx="16" fill="none" stroke="url(#accent-grad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Background Decorative Grid -->
  <g opacity="0.12" stroke="#60a5fa" stroke-width="0.75">
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="250" y1="0" x2="250" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="550" y1="0" x2="550" y2="360"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
    <line x1="850" y1="0" x2="850" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
    <line x1="1150" y1="0" x2="1150" y2="360"/>
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>

  <!-- Dynamic Animated Background Aura / Energy Rings -->
  <g class="animated-wave" opacity="0.45">
    <ellipse cx="600" cy="180" rx="480" ry="140" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="6,8" opacity="0.3"/>
    <ellipse cx="600" cy="180" rx="380" ry="110" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,6" opacity="0.35"/>
    <circle cx="150" cy="80" r="120" fill="#38bdf8" filter="url(#soft-glow)" opacity="0.08"/>
    <circle cx="1050" cy="280" r="140" fill="#a855f7" filter="url(#soft-glow)" opacity="0.10"/>
  </g>

  <!-- Dynamic Radar Scanner (Subtle Background Graphic on Right) -->
  <g opacity="0.25">
    <circle cx="1050" cy="180" r="90" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="1050" cy="180" r="60" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="1050" cy="180" r="30" fill="none" stroke="#c084fc" stroke-width="1"/>
    <line x1="960" y1="180" x2="1140" y2="180" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.4"/>
    <line x1="1050" y1="90" x2="1050" y2="270" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.4"/>
    <g class="radar-sweep-elem">
      <line x1="1050" y1="180" x2="1140" y2="180" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.8"/>
    </g>
  </g>

  <!-- Dynamic Animated Scanline Beam -->
  <g class="scanner-beam" opacity="0.3">
    <rect x="0" y="30" width="120" height="300" fill="url(#text-grad)" opacity="0.06" filter="url(#glow)"/>
    <line x1="60" y1="20" x2="60" y2="340" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Floating Ambient Pills (In Background/Midground Behind Text) -->
  <g class="floating-tag-1" opacity="0.55">
    <rect x="90" y="45" width="160" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <text x="170" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc" text-anchor="middle">🔍 Semantic Retrieval</text>
  </g>

  <g class="floating-tag-2" opacity="0.55">
    <rect x="920" y="55" width="190" height="30" rx="15" fill="#1e293b" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5"/>
    <text x="1015" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#d8b4fe" text-anchor="middle">⚡ Codebase RAG &amp; AST</text>
  </g>

  <g class="floating-tag-3" opacity="0.55">
    <rect x="80" y="285" width="210" height="30" rx="15" fill="#1e293b" stroke="#34d399" stroke-width="1" stroke-opacity="0.5"/>
    <text x="185" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7" text-anchor="middle">🤖 Autonomous Code Agents</text>
  </g>

  <!-- ================= FOREGROUND HERO CONTENT (High Z-Index, Crisp & Clear) ================= -->
  
  <!-- Search Bar Visual Anchor in Center -->
  <g transform="translate(360, 68)">
    <rect width="480" height="42" rx="21" fill="#0f172a" stroke="url(#accent-grad)" stroke-width="1.8" filter="url(#glow)"/>
    <!-- Terminal / Search Prompt Icon -->
    <path d="M 22 21 M 18 15 L 24 21 L 18 27" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="36" y="26" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="14" fill="#94a3b8" font-weight="500">semantic_search(<tspan fill="#38bdf8">"retrieve_codebase_context()"</tspan>)</text>
    <rect x="420" y="11" width="46" height="20" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
    <text x="443" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#cbd5e1" text-anchor="middle">⌘ K</text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.5" fill="url(#text-grad)" text-anchor="middle" filter="url(#glow)">
    AWESOME AI CODE SEARCH
  </text>

  <!-- Hero Subtitle -->
  <text x="600" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="0.3" fill="#e2e8f0" text-anchor="middle">
    Top Semantic Code Search Engines • Codebase RAG • Vector Indexing • AST Intelligence
  </text>

  <!-- Category Badges / Pills Below Subtitle -->
  <g transform="translate(600, 260)" text-anchor="middle">
    <!-- Center Pills Group -->
    <g transform="translate(-250, 0)">
      <rect x="0" y="0" width="150" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="75" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#a5b4fc">🏢 SaaS Platforms</text>
    </g>
    <g transform="translate(-80, 0)">
      <rect x="0" y="0" width="160" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="80" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#6ee7b7">🐙 Open-Source Repos</text>
    </g>
    <g transform="translate(100, 0)">
      <rect x="0" y="0" width="160" height="26" rx="13" fill="#4c1d95" stroke="#a855f7" stroke-width="1"/>
      <text x="80" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#f0abfc">⚡ Developer Tools</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="450" y1="318" x2="750" y2="318" stroke="url(#accent-grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
</svg>
